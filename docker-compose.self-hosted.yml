version: '3.8'

services:
  n8n:
    build:
      context: .
      dockerfile: docker/images/n8n/Dockerfile.self-hosted
    ports:
      - "5678:5678"
    environment:
      # Основные настройки
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      
      # Self-hosted настройки
      N8N_SELF_HOSTED: true
      N8N_DISABLE_TELEMETRY: true
      N8N_ENABLE_ALL_FEATURES: true
      N8N_DISABLE_COMMUNITY_NODES: true
      N8N_DISABLE_VERSION_CHECK: true
      
      # Безопасность (ОБЯЗАТЕЛЬНО измените!)
      N8N_ENCRYPTION_KEY: your_32_character_encryption_key_here
      N8N_JWT_SECRET: your_jwt_secret_here
      
      # База данных
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: n8n_password
      
      # Логирование
      N8N_LOG_LEVEL: info
      N8N_LOG_OUTPUT: console,file
      
      # Производительность
      EXECUTIONS_MODE: regular
      EXECUTIONS_TIMEOUT: 3600
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTION: true
      
      # Файлы
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      N8N_BINARY_DATA_TTL: 24
      N8N_BINARY_DATA_STORAGE_PATH: /home/node/.n8n/files
      
      # Интерфейс
      N8N_PERSONALIZATION_ENABLED: true
      N8N_DEFAULT_LOCALE: en
      
    volumes:
      - n8n_data:/home/node/.n8n
      - n8n_logs:/var/log/n8n
    depends_on:
      - postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: n8n_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Опционально: Redis для очереди (если нужна высокая производительность)
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass redis_password
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  n8n_data:
    driver: local
  n8n_logs:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: n8n-self-hosted
